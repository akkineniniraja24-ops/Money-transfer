<!DOCTYPE html>
<html>
<head>
<title>Bank Details</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#12003b;
    color:white;
}

.header{
    background:#5b1fd1;
    padding:25px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.card{
    background:#1f1f1f;
    width:80%;
    margin:40px auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(255,255,255,0.2);
}

.row{
    margin:15px 0;
}

.label{
    color:#bbb;
    font-size:14px;
}

.value{
    font-size:20px;
    font-weight:bold;
}

.balance{
    text-align:center;
    margin-top:20px;
    font-size:32px;
    color:#00ff99;
}

.btn{
    display:block;
    width:200px;
    margin:30px auto;
    text-align:center;
    background:#7b2cff;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
}

.btn:hover{
    background:#9a55ff;
}
</style>

</head>
<body>

<div class="header">
    🏦 My Bank Account
</div>

<div class="card">

    <div class="row">
        <div class="label">Account Holder</div>
        <div class="value">Akkineni Niraja</div>
    </div>

    <div class="row">
        <div class="label">Bank Name</div>
        <div class="value">Silver Bank</div>
    </div>

    <div class="row">
        <div class="label">Account Number</div>
        <div class="value">XXXX XXXX 4567</div>
    </div>

    <div class="row">
        <div class="label">IFSC Code</div>
        <div class="value">SILV0001234</div>
    </div>

    <div class="balance">
        ₹25,000
    </div>

</div>

<a href="home .html" class="btn">
⬅ Back to Home
</a>

</body>
</html>
