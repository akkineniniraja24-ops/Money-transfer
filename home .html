<!DOCTYPE html>
<html>
<head>
<title>Money Transfer App</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#12003b;
    color:white;
}

.header{
    background:#5b1fd1;
    padding:30px;
    text-align:center;
    font-size:35px;
    font-weight:bold;
    border-radius:0 0 30px 30px;
}

.section{
    padding:20px;
}

h2{
    margin-bottom:20px;
}

.menu{
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    gap:15px;
}

.item{
    width:90px;
    text-align:center;
}

.item a{
    text-decoration:none;
    color:white;
}

.icon{
    width:65px;
    height:65px;
    background:#7b2cff;
    border-radius:50%;
    margin:auto;
    line-height:65px;
    font-size:28px;
    transition:0.3s;
}

.icon:hover{
    background:#9a55ff;
    transform:scale(1.1);
}

.bottom{
    position:fixed;
    bottom:0;
    width:100%;
    background:#111;
    display:flex;
    justify-content:space-around;
    padding:15px 0;
}
</style>
</head>
<body>

<div class="header">
    SILVER PAY
</div>

<div class="section">
    <h2>Money Transfers</h2>

    <div class="menu">

        <div class="item">
            <a href="mobile.html">
                <div class="icon">📱</div>
                <p>Mobile</p>
            </a>
        </div>

        <div class="item">
            <a href="bank.html">
                <div class="icon">🏦</div>
                <p>Bank</p>
            </a>
        </div>

        <div class="item">
            <a href="rewards.html">
                <div class="icon">💰</div>
                <p>Wallet</p>
            </a>
        </div>

        <div class="item">
            <a href="balance.html">
                <div class="icon">₹</div>
                <p>Balance</p>
            </a>
        </div>

    </div>

    <h2>Recharge & Bills</h2>

    <div class="menu">

        <div class="item">
            <a href="recharge.html">
                <div class="icon">🔋</div>
                <p>Recharge</p>
            </a>
        </div>

        <div class="item">
            <a href="fees.html">
                <div class="icon">📖</div>
                <p>Fees</p>
            </a>
        </div>

        <div class="item">
            <a href="electricity.html">
                <div class="icon">💡</div>
                <p>Electricity</p>
            </a>
        </div>

        <div class="item">
            <a href="loan.html">
                <div class="icon">💼</div>
                <p>Loan</p>
            </a>
        </div>

    </div>
</div>

<div class="bottom">
    <span>🏠 Home</span>
    <span>🔍 Search</span>
    <span>📷 Scan</span>
    <span>🔔 Alerts</span>
    <span>🕒 History</span>
</div>

</body>
</html>
