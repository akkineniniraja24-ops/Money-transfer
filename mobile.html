<!DOCTYPE html>
<html>
<head>
<title>Select Contact</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#12003b;
    color:white;
}

.header{
    background:#5b1fd1;
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.contact{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#1f1f1f;
    margin:10px;
    padding:15px;
    border-radius:12px;
}

.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#7b2cff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
}

.info{
    flex:1;
    margin-left:15px;
}

.name{
    font-size:18px;
    font-weight:bold;
}

.number{
    color:#bbb;
}

.sendBtn{
    background:#7b2cff;
    border:none;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.back{
    display:block;
    text-align:center;
    color:white;
    margin:20px;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
📱 Select Contact
</div>

<div id="contacts"></div>

<a href="home .html" class="back">
⬅ Back to Home
</a>

<script>

const contacts = [
    {name:"Nanna", number:"9876543210"},
    {name:"Thammudu", number:"9123456780"},
    {name:"Niraja", number:"9000011111"},
    {name:"Kaigala Siva", number:"9555512345"},
    {name:"Friend", number:"9888877777"}
];

let output = "";

contacts.forEach(contact => {

    output += `
    <div class="contact">

        <div class="avatar">
            ${contact.name.charAt(0)}
        </div>

        <div class="info">
            <div class="name">${contact.name}</div>
            <div class="number">${contact.number}</div>
        </div>

        <button class="sendBtn"
        onclick="sendMoney('${contact.name}','${contact.number}')">
        Send
        </button>

    </div>
    `;
});

document.getElementById("contacts").innerHTML = output;

function sendMoney(name, number){

    let amount = prompt(
        "Enter amount to send to " + name
    );

    if(amount){

        alert(
            "₹" + amount +
            " sent to " +
            name +
            " (" + number + ")"
        );
    }
}

</script>

</body>
</html>
